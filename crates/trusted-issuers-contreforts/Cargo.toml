[package]
name = "trusted-issuers-contreforts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Implements Contreforts' ContrefortsConnector trait for trusted-issuers-graph, so the registry's issuer records and audit log are reachable through Contreforts' generic connector interface."

[dependencies]
contreforts-core = { path = "../../vendor/contreforts-core" }
trusted-issuers-graph = { path = "../trusted-issuers-graph" }
trusted-issuers-core = { path = "../trusted-issuers-core" }
async-trait = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
contreforts-declaration = { path = "../../vendor/contreforts-core/declaration" }
tokio = { workspace = true }
