[package]
name = "trusted-issuers-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Trusted issuers registry domain: issuer/accreditation records, the accreditation-chain trust check, and the signed trust-list snapshot (sign and verify). Network-free, so verifiers such as ds-identity-hub-rs can embed it."

[dependencies]
ds-dcp-core-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
p256 = { workspace = true }
sha2 = { workspace = true }
webpki = { workspace = true }
rustls-pki-types = { workspace = true }
base64 = { workspace = true }
x509-cert = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
# Validates exports against the official ETSI and EBSI JSON schemas in
# tests/conformance.rs.
jsonschema = { version = "0.33", default-features = false }
