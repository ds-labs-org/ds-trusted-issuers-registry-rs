name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # vendor/contreforts-core (the Contreforts connector interface).
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  conformance:
    name: Conformance (ETSI LoTE, EBSI accreditation, x509-limbo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache conformance downloads
        uses: actions/cache@v4
        with:
          path: target/conformance/downloads
          key: conformance-${{ hashFiles('conformance/fetch.sh') }}

      - name: Fetch conformance material (pinned, checksummed)
        run: conformance/fetch.sh

      - name: Run conformance tests
        run: cargo test -p trusted-issuers-core --test conformance -- --ignored
